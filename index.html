<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YPixel Demon List</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #222;
    padding: 25px 10px;
    text-align: center;
}

h1 {
    margin: 0;
    color: #ffd900;
}

.subtitle {
    color: #aaa;
}

.demon {
    margin: 15px;
    padding: 18px;
    background: #1e1e1e;
    border-radius: 12px;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 18px;
}

.rank {
    font-size: 28px;
    font-weight: bold;
    color: #ffd900;
}

.info h2 {
    margin: 0 0 8px;
}

.info p {
    margin: 5px 0;
    color: #bbb;
}

.points {
    color: #ffd900 !important;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>YPixel Demon List</h1>
    <p class="subtitle">Main List</p>
</header>

<div class="demon">
    <div class="rank">#1</div>
    <div class="info">
        <h2>YOUR FIRST DEMON</h2>
        <p>Creator: YPixel</p>
        <p class="points">100 Points</p>
    </div>
</div>

<div class="demon">
    <div class="rank">#2</div>
    <div class="info">
        <h2>SECOND DEMON</h2>
        <p>Creator: Player</p>
        <p class="points">90 Points</p>
    </div>
</div>

<div class="demon">
    <div class="rank">#3</div>
    <div class="info">
        <h2>THIRD DEMON</h2>
        <p>Creator: Player</p>
        <p class="points">80 Points</p>
    </div>
</div>

</body>
</html>
